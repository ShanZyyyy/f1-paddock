<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NASCAR 3D Manager</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0e12;font-family:system-ui,sans-serif;}
  canvas{display:block;}
  [hidden]{display:none!important;} /* .panel gibi display:flex koyan sınıflar [hidden]'ı ezmesin */
  #status{position:fixed;top:10px;left:10px;color:#8fa2b0;font-size:12px;font-family:ui-monospace,monospace;z-index:2;}

  #money-hud{
    position:fixed; top:16px; left:50%; transform:translateX(-50%);
    z-index:3; display:flex; align-items:center; gap:8px;
    padding:9px 18px; border-radius:999px;
    background:rgba(15,20,25,.68); border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    font-family:ui-monospace,monospace; color:#eef3f6;
    box-shadow:0 10px 24px -12px rgba(0,0,0,.6);
  }
  #money-hud .coin{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe28a,#f2b705 60%,#8a6d1f 100%);flex:none;}
  #money-hud .amount{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;}
  #money-hud .sub{font-size:10px;color:#8fa2b0;margin-left:2px;}

  #offline-toast{
    position:fixed; top:64px; left:50%; transform:translateX(-50%);
    z-index:3; padding:8px 16px; border-radius:12px;
    background:rgba(242,183,5,.14); border:1px solid rgba(242,183,5,.4);
    color:#ffe28a; font-family:ui-monospace,monospace; font-size:12px;
    opacity:0; transition:opacity .4s ease; pointer-events:none; text-align:center; max-width:88vw;
  }
  #offline-toast.show{opacity:1;}

  .lap-pop{
    position:fixed; z-index:3; transform:translate(-50%,-50%);
    font-family:ui-monospace,monospace; font-weight:700; font-size:15px;
    color:#ffe28a; text-shadow:0 1px 4px rgba(0,0,0,.7);
    animation:lapPop .8s ease-out forwards; pointer-events:none;
  }
  @keyframes lapPop{
    0%{opacity:0; transform:translate(-50%,-40%) scale(.8);}
    18%{opacity:1; transform:translate(-50%,-60%) scale(1);}
    100%{opacity:0; transform:translate(-50%,-130%) scale(1);}
  }
  .lap-pop.overtake{color:#8ee8ff;}

  /* ---------- sıralama tablosu (standings) ---------- */
  #standings{
    position:fixed; top:66px; right:14px; z-index:3;
    display:flex; flex-direction:column; gap:4px;
    padding:8px; border-radius:12px;
    background:rgba(15,20,25,.68); border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    font-family:ui-monospace,monospace; min-width:120px;
    box-shadow:0 10px 24px -12px rgba(0,0,0,.6);
  }
  .stand-row{display:flex; align-items:center; gap:7px; font-size:11.5px; color:#c7d0d6; padding:1px 2px;}
  .stand-row .pos{width:14px; color:#8fa2b0; font-weight:700;}
  .stand-row .dot{width:9px; height:9px; border-radius:50%; flex:none;}
  .stand-row.me{color:#ffe28a; font-weight:700;}

  /* ---------- ayarlar (önceki oyundan taşınan arayüz dili) ---------- */
  .icon-btn{
    position:fixed; top:16px; left:14px; z-index:3;
    width:34px; height:34px; border:1px solid rgba(255,255,255,.12); border-radius:50%;
    background:rgba(15,20,25,.68); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    color:#eef3f6; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .icon-btn svg{width:16px; height:16px;}
  .panel{
    position:fixed; inset:0; z-index:10; display:flex; flex-direction:column; gap:14px;
    padding:18px; background:linear-gradient(180deg,#101a23,#0a1119); color:#eef3f6;
    font-family:system-ui,sans-serif;
  }
  .panel-top{display:flex; align-items:center; gap:10px; font-weight:700; font-size:15px;}
  .switch-row{
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    background:#1f2e3b; border:1px solid rgba(255,255,255,.1); border-radius:12px; padding:12px 14px;
  }
  .switch-label{font-size:13px; font-weight:600;}
  .switch-desc{font-size:11px; color:#8fa2b0; margin-top:2px;}
  .switch-track{width:44px; height:26px; border-radius:99px; background:#16212c; position:relative; cursor:pointer; flex:none; transition:background .2s ease;}
  .switch-track.on{background:#f2b705;}
  .switch-knob{position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:left .2s ease; box-shadow:0 1px 3px rgba(0,0,0,.4);}
  .switch-track.on .switch-knob{left:21px;}
</style>
</head>
<body>
<div id="status">Sahne kuruluyor…</div>
<div id="money-hud"><span class="coin"></span><span class="amount" id="money-amount">0 ₺</span><span class="sub">/tur <span id="lap-reward">0</span></span></div>
<div id="offline-toast"></div>
<div id="standings"></div>
<button class="icon-btn" id="settings-open" aria-label="Ayarlar">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V21a2 2 0 0 1-4 0v-.09A1.7 1.7 0 0 0 9 19.37a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.64 15a1.7 1.7 0 0 0-1.56-1.04H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.63 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.63a1.7 1.7 0 0 0 1.04-1.56V3a2 2 0 0 1 4 0v.09a1.7 1.7 0 0 0 1.04 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.37 9a1.7 1.7 0 0 0 1.56 1.04H21a2 2 0 0 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></svg>
</button>
<div class="panel" id="settings-panel" hidden>
  <div class="panel-top">
    <button class="icon-btn" id="settings-close" style="position:static;" aria-label="Kapat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <span>Ayarlar</span>
  </div>
  <div class="switch-row">
    <div>
      <div class="switch-label">Ses</div>
      <div class="switch-desc">Tur ve geçiş seslerini aç/kapat.</div>
    </div>
    <div class="switch-track" id="sound-switch"><div class="switch-knob"></div></div>
  </div>
</div>
<script>
(function(){
  'use strict';

  /* =========================================================
     0. GÜVENİLİR SAAT (Anti-Cheat) — tek bir client-side dosyada
     "gerçek" bir hile koruması yapılamaz (kullanıcı kendi
     tarayıcısının/localStorage'ının efendisidir), ama iki standart
     ve dürüst önlemle kandırmayı anlamsız hale getiriyoruz:

     1) OTURUM İÇİ tespiti: performance.now() işletim sistemi saatinden
        bağımsız, monotonik (hep ileri) akar. Duvar saati (Date.now())
        ile bu monotonik sayaç arasında birkaç saniyeden büyük bir
        sapma oluşursa, kullanıcı oyun AÇIKKEN saati/tarihi oynatmış
        demektir — bu durumda duvar saatine değil monotonik tahmine
        güveniyoruz.
     2) KAPALIYKEN geçen süre için gerçek "hile tespiti" imkansız
        (performance.now() her sayfa yüklemesinde sıfırlanır), o yüzden
        onun yerine standart idle-oyun önlemini uyguluyoruz: çevrimdışı
        kazanç ne kadar süre iddia edilirse edilsin MAX_OFFLINE_SECONDS
        ile sınırlanıyor — saati 1 ay ileri almak, telefonu 12 saat
        kapalı tutmaktan fazla ödül vermiyor.
     ========================================================= */
  var TrustedClock = (function(){
    var anchorEpoch = Date.now();
    var anchorPerf = performance.now();
    var TAMPER_TOLERANCE_MS = 3000;
    return {
      now: function(){
        var perfDelta = performance.now() - anchorPerf;
        var wallDelta = Date.now() - anchorEpoch;
        if(Math.abs(wallDelta - perfDelta) > TAMPER_TOLERANCE_MS){
          return { time: anchorEpoch + perfDelta, tampered: true };
        }
        return { time: Date.now(), tampered: false };
      }
    };
  })();

  /* =========================================================
     0b. EKONOMİ — para, dev sayı formatlama, çevrimdışı kazanç
     ========================================================= */
  var STORAGE_KEY = 'nascar3d_v1';
  var LAP_REWARD = 250;                 // her tamamlanan tur için ₺
  var MAX_OFFLINE_SECONDS = 12*3600;    // çevrimdışı kazanç tavanı (12 sa)

  function formatMoney(n){
    n = Math.max(0, Math.floor(n));
    var units = [
      {v:1e12, s:'T'}, {v:1e9, s:'B'}, {v:1e6, s:'M'}, {v:1e3, s:'K'}
    ];
    for(var i=0;i<units.length;i++){
      var scaled = n/units[i].v;
      var rounded = Math.round(scaled*10)/10;
      if(rounded >= 1){
        // Yuvarlama tam sınırı aşırsa (999.96K gibi) bir üst birime taş —
        // yoksa "1000K ₺" gibi yanlış bir gösterim çıkar.
        if(rounded >= 1000 && i > 0){
          i -= 1;
          rounded = Math.round((n/units[i].v)*10)/10;
        }
        return rounded.toFixed(1).replace(/\.0$/,'') + units[i].s + ' ₺';
      }
    }
    return n + ' ₺';
  }

  function defaultState(){
    return { money: 0, lastSeenAt: TrustedClock.now().time, soundOn: true };
  }
  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return null;
      var parsed = JSON.parse(raw);
      if(parsed && typeof parsed.money === 'number' && typeof parsed.lastSeenAt === 'number') return parsed;
    }catch(e){}
    return null;
  }
  function saveState(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }

  var state = Object.assign(defaultState(), loadState() || {});

  // Çevrimdışı kazanç: kapalı kaldığı süreyi tur ödülüne çevirir,
  // ama saat ileri alınsa bile MAX_OFFLINE_SECONDS'ı asla aşmaz.
  function creditOfflineEarnings(){
    var nowInfo = TrustedClock.now();
    var rawElapsed = (nowInfo.time - state.lastSeenAt) / 1000;

    if(rawElapsed <= 1){
      state.lastSeenAt = nowInfo.time;
      return null; // yeni oyun ya da saat geri alınmış — kazanç yok, ceza da yok
    }

    var credited = Math.min(rawElapsed, MAX_OFFLINE_SECONDS);
    var wasCapped = rawElapsed > MAX_OFFLINE_SECONDS;
    var lapsDuringOffline = credited / (1/cars0Speed());
    var earned = Math.round(lapsDuringOffline * LAP_REWARD);

    state.money += earned;
    state.lastSeenAt = nowInfo.time;
    saveState();

    return { earned: earned, seconds: credited, capped: wasCapped };
  }

  // Oyuncu arabasının tur süresini (sn) döndürür — çevrimdışı kazancı
  // canlı ekonomiyle aynı orana göre hesaplamak için.
  function cars0Speed(){ return (typeof cars !== 'undefined' && cars[0]) ? cars[0].tSpeed : (1/14); }

  /* =========================================================
     0c. SES — önceki oyundan taşınan prosedürel Web Audio sentezi,
     dış ses dosyası yok. Ayarlar panelindeki anahtarla açık/kapalı.
     ========================================================= */
  var Sound = {
    ctx:null,
    ensureCtx:function(){
      if(!this.ctx){ var Ctx = window.AudioContext||window.webkitAudioContext; if(!Ctx) return null; this.ctx = new Ctx(); }
      if(this.ctx.state==='suspended') this.ctx.resume();
      return this.ctx;
    },
    note:function(freq, delay, dur, type, vol){
      if(!state.soundOn) return;
      var ctx = this.ensureCtx(); if(!ctx) return;
      var t0 = ctx.currentTime + (delay||0);
      var osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = type||'square';
      osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(vol||0.12, t0+0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0+(dur||0.12));
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t0); osc.stop(t0+(dur||0.12)+0.02);
    },
    chime:function(notes){ var self=this; notes.forEach(function(n){ self.note(n[0],n[1],n[2],n[3],n[4]); }); },
    lap:function(){ this.chime([[523,0,0.1,'triangle',0.13],[659,0.09,0.1,'triangle',0.13],[784,0.18,0.16,'triangle',0.14]]); },
    overtake:function(){ this.chime([[880,0,0.06,'sawtooth',0.09],[1046,0.05,0.09,'sawtooth',0.1]]); }
  };

  /* =========================================================
     1. PİST GEOMETRİSİ — Daytona tarzı, eğimli (banked) oval.
     Merkez hattı 2 düzlük + 2 yarım daire virajdan oluşan bir
     stadyum eğrisi; virajlarda banking açısı sinüs eğrisiyle
     0 -> maksimum -> 0 şeklinde yumuşakça değişiyor.
     ========================================================= */
  var HALF_LEN = 120;      // düzlüklerin merkeze uzaklığı
  var CAP_R = 70;          // viraj (cap) yarıçapı
  var TRACK_WIDTH = 26;
  var MAX_BANK = THREE.MathUtils.degToRad(30); // Daytona ~31°
  var SEGMENTS = 120;

  var STRAIGHT = 2*HALF_LEN, CAP = Math.PI*CAP_R, TOTAL = 2*STRAIGHT + 2*CAP;
  var F1 = STRAIGHT/TOTAL, F2 = F1 + CAP/TOTAL, F3 = F2 + STRAIGHT/TOTAL;

  function pointAt(t){
    t = ((t % 1) + 1) % 1;
    var x, z;
    if(t < F1){ var s = t/F1; x = -HALF_LEN + s*2*HALF_LEN; z = CAP_R; }
    else if(t < F2){ var u = (t-F1)/(F2-F1); var a = Math.PI/2 - u*Math.PI; x = HALF_LEN + Math.cos(a)*CAP_R; z = Math.sin(a)*CAP_R; }
    else if(t < F3){ var s2 = (t-F2)/(F3-F2); x = HALF_LEN - s2*2*HALF_LEN; z = -CAP_R; }
    else { var u2 = (t-F3)/(1-F3); var a2 = -Math.PI/2 - u2*Math.PI; x = -HALF_LEN + Math.cos(a2)*CAP_R; z = Math.sin(a2)*CAP_R; }
    return {x:x, z:z};
  }
  function bankAt(t){
    t = ((t % 1) + 1) % 1;
    if(t < F1) return 0;
    if(t < F2){ var p = (t-F1)/(F2-F1); return MAX_BANK*Math.sin(p*Math.PI); }
    if(t < F3) return 0;
    var p2 = (t-F3)/(1-F3); return MAX_BANK*Math.sin(p2*Math.PI);
  }

  function buildBankedTrack(){
    var positions = [];
    var indices = [];
    var innerLine = [];  // infield şeklini çizmek için (bank'siz, düz)
    var outerRing = [];  // bariyer duvarı için: her noktada dış kenar + side + bank
    var halfW = TRACK_WIDTH/2;
    var up = new THREE.Vector3(0,1,0);

    for(var i = 0; i <= SEGMENTS; i++){
      var t = (i/SEGMENTS) % 1;
      var p0 = pointAt(t);
      var p1 = pointAt((t + 0.0015) % 1);
      var tangent = new THREE.Vector3(p1.x-p0.x, 0, p1.z-p0.z).normalize();
      var side = new THREE.Vector3().crossVectors(tangent, up).normalize();
      var bank = bankAt(t);

      var center = new THREE.Vector3(p0.x, 0, p0.z);
      var outer = center.clone().addScaledVector(side, halfW*Math.cos(bank));
      outer.y += halfW*Math.sin(bank);
      var inner = center.clone().addScaledVector(side, -halfW*Math.cos(bank));
      inner.y -= halfW*Math.sin(bank);

      positions.push(inner.x, inner.y, inner.z);
      positions.push(outer.x, outer.y, outer.z);
      // Çim sınırı, arabaların erişebileceği en dış şeritten (LANES ±9) belirgin
      // şekilde İÇERİDE kalacak kadar dar tutuluyor — böylece hiçbir arabanın
      // konumu banking'de asla çim alanının x/z izdüşümüyle çakışmıyor, "çime
      // gömülme" görsel hatası kökünden engelleniyor.
      innerLine.push({x: p0.x - side.x*(halfW*0.34), z: p0.z - side.z*(halfW*0.34)});
      outerRing.push({center:center, side:side, bank:bank, outer:outer});
    }
    for(var s = 0; s < SEGMENTS; s++){
      var i0 = s*2, i1 = s*2+1, i2 = (s+1)*2, i3 = (s+1)*2+1;
      indices.push(i0, i2, i1,  i1, i2, i3);
    }

    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setIndex(indices);
    geo.computeVertexNormals();
    // Kavis yönü/kazanç işareti garanti değil — DoubleSide, hangi taraftan
    // bakılırsa bakılsın pistin görünmez/siyah kalmasını engelliyor.
    var mat = new THREE.MeshLambertMaterial({color:0x2b2f33, side:THREE.DoubleSide});
    var mesh = new THREE.Mesh(geo, mat);

    return {mesh:mesh, innerLine:innerLine, outerRing:outerRing};
  }

  // Dış kenar boyunca, banking'in DEVAMI yönünde (yani pistle aynı eğimde)
  // yükselen bir bariyer duvarı — banking'in "kaybolduğu" izometrik açıyı
  // telafi eden en net görsel ipucu bu duvarın yatışı.
  function buildBarrierWall(outerRing){
    var WALL_RISE = 11; // pistin dış kenarından "dist" cinsinden ek yükseklik
    var positions = [];
    var indices = [];
    for(var i = 0; i < outerRing.length; i++){
      var r = outerRing[i];
      var halfW = TRACK_WIDTH/2;
      var top = r.center.clone().addScaledVector(r.side, (halfW+WALL_RISE)*Math.cos(r.bank));
      top.y += (halfW+WALL_RISE)*Math.sin(r.bank);
      positions.push(r.outer.x, r.outer.y, r.outer.z);
      positions.push(top.x, top.y, top.z);
    }
    for(var s = 0; s < outerRing.length-1; s++){
      var i0=s*2, i1=s*2+1, i2=(s+1)*2, i3=(s+1)*2+1;
      indices.push(i0,i2,i1, i1,i2,i3);
    }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions,3));
    geo.setIndex(indices);
    geo.computeVertexNormals();
    var mat = new THREE.MeshLambertMaterial({color:0xd8d4c8, side:THREE.DoubleSide});
    return new THREE.Mesh(geo, mat);
  }

  // İç alanda (infield), start/finish düzlüğüne paralel sade bir pit yolu
  // zemini + birkaç pit durağı kutusu.
  function buildPitLane(scene){
    var pitLen = HALF_LEN*1.5, pitWidth = 16;
    var floorGeo = new THREE.PlaneGeometry(pitLen, pitWidth);
    var floorMat = new THREE.MeshLambertMaterial({color:0x4a4d50});
    var floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI/2;
    floor.position.set(0, 0.02, CAP_R*0.42);
    scene.add(floor);

    var laneLineGeo = new THREE.PlaneGeometry(pitLen, 0.6);
    var laneLineMat = new THREE.MeshLambertMaterial({color:0xf2b705});
    var laneLine = new THREE.Mesh(laneLineGeo, laneLineMat);
    laneLine.rotation.x = -Math.PI/2;
    laneLine.position.set(0, 0.03, CAP_R*0.42 - pitWidth/2 + 0.8);
    scene.add(laneLine);

    var STALLS = 6;
    for(var i=0;i<STALLS;i++){
      var sx = -pitLen/2 + (i+0.5)*(pitLen/STALLS);
      var geo = new THREE.BoxGeometry(pitLen/STALLS*0.7, 3.2, 6);
      var mat = new THREE.MeshLambertMaterial({color: i%2===0 ? 0xe0483e : 0x3f6bd8});
      var box = new THREE.Mesh(geo, mat);
      box.position.set(sx, 1.6, CAP_R*0.42 + pitWidth/2 - 2.5);
      scene.add(box);
    }
  }

  // Pit yolunun ana pistten AYRILDIĞI ve tekrar BİRLEŞTİĞİ görünür bir
  // giriş/çıkış rampası — düz (banking'siz), ana pistten daha dar.
  var PIT_ENTRY_T = 0.03, PIT_EXIT_T = 0.225;
  function buildPitRoad(){
    var entryMain = pointAt(PIT_ENTRY_T), exitMain = pointAt(PIT_EXIT_T);
    var pitZ = CAP_R*0.42;
    var curvePts = [
      new THREE.Vector3(entryMain.x, 0.05, entryMain.z),
      new THREE.Vector3(entryMain.x+22, 0.05, pitZ+17),
      new THREE.Vector3(-65, 0.05, pitZ+13),
      new THREE.Vector3(65, 0.05, pitZ+13),
      new THREE.Vector3(exitMain.x-22, 0.05, pitZ+17),
      new THREE.Vector3(exitMain.x, 0.05, exitMain.z)
    ];
    var curve = new THREE.CatmullRomCurve3(curvePts);
    var pts = curve.getPoints(70);
    var halfW = 5.2;
    var positions = [], indices = [];
    for(var i=0;i<pts.length;i++){
      var p = pts[i];
      var next = pts[Math.min(i+1, pts.length-1)];
      var tangent = new THREE.Vector3().subVectors(next, p).normalize();
      var side = new THREE.Vector3().crossVectors(tangent, new THREE.Vector3(0,1,0)).normalize();
      var inner = p.clone().addScaledVector(side, -halfW);
      var outer = p.clone().addScaledVector(side, halfW);
      positions.push(inner.x, inner.y, inner.z, outer.x, outer.y, outer.z);
    }
    for(var s=0;s<pts.length-1;s++){
      var i0=s*2, i1=s*2+1, i2=(s+1)*2, i3=(s+1)*2+1;
      indices.push(i0,i2,i1, i1,i2,i3);
    }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions,3));
    geo.setIndex(indices);
    geo.computeVertexNormals();
    var mat = new THREE.MeshLambertMaterial({color:0x35383b, side:THREE.DoubleSide});
    return { mesh:new THREE.Mesh(geo, mat), curve:curve };
  }

  // Start/finish üzerinde basit bir kule (gerçek NASCAR pistlerindeki gibi) —
  // "çevre faktörü" olarak sahneye atmosfer katıyor.
  function buildGantry(scene){
    var p = pointAt(0);
    var group = new THREE.Group();
    [-1,1].forEach(function(side){
      var leg = new THREE.Mesh(new THREE.BoxGeometry(2,26,2), new THREE.MeshLambertMaterial({color:0x2a2f33}));
      leg.position.set(side*(TRACK_WIDTH/2+6), 13, 0);
      group.add(leg);
    });
    var beam = new THREE.Mesh(new THREE.BoxGeometry(TRACK_WIDTH+16,2.4,2.4), new THREE.MeshLambertMaterial({color:0x2a2f33}));
    beam.position.set(0, 25, 0);
    group.add(beam);
    for(var i=0;i<5;i++){
      var lx = -((TRACK_WIDTH+16)/2) + 8 + i*((TRACK_WIDTH+16-16)/4);
      var light = new THREE.Mesh(new THREE.SphereGeometry(1.1,10,10), new THREE.MeshLambertMaterial({color:0xf2b705, emissive:0x3a2900, emissiveIntensity:0.5}));
      light.position.set(lx, 22.6, 0);
      group.add(light);
    }
    group.position.set(p.x, 0, p.z);
    group.lookAt(p.x, 0, p.z-1); // düzlük yönünde hizala (x ekseni boyunca düzlük)
    group.rotation.y = Math.PI/2;
    scene.add(group);
  }

  // Tribün üstlerinde küçük renkli noktalar: kalabalık dokusu, ucuz ve
  // mobilde ağırlık yaratmayan bir "çevre" detayı.
  function buildCrowd(scene){
    var geo = new THREE.SphereGeometry(0.45, 5, 4);
    var colors = [0xe0483e,0xf2b705,0x3f6bd8,0xeef3f6,0x3fae5c];
    var CROWD_PER_STAND = 10;
    for(var i=0;i<22;i++){
      var t = i/22;
      var p = pointAt(t);
      var outward = 1.22;
      for(var c=0;c<CROWD_PER_STAND;c++){
        var mat = new THREE.MeshLambertMaterial({color: colors[(i+c)%colors.length]});
        var dot = new THREE.Mesh(geo, mat);
        var jitterX = (Math.random()-0.5)*13, jitterZ = (Math.random()-0.5)*5.5;
        dot.position.set(p.x*outward + jitterX, 9.4, p.z*outward + jitterZ);
        scene.add(dot);
      }
    }
  }

  function buildInfield(innerLine){
    var shape = new THREE.Shape();
    innerLine.forEach(function(p, i){ i===0 ? shape.moveTo(p.x,p.z) : shape.lineTo(p.x,p.z); });
    var geo = new THREE.ShapeGeometry(shape);
    var mat = new THREE.MeshLambertMaterial({color:0x2f6b3f, side:THREE.DoubleSide});
    var mesh = new THREE.Mesh(geo, mat);
    mesh.rotation.x = -Math.PI/2;
    mesh.position.y = -0.05;
    return mesh;
  }

  function buildGround(){
    var geo = new THREE.PlaneGeometry(2000, 2000);
    var mat = new THREE.MeshLambertMaterial({color:0x171c1f});
    var mesh = new THREE.Mesh(geo, mat);
    mesh.rotation.x = -Math.PI/2;
    mesh.position.y = -0.6;
    return mesh;
  }

  function buildStands(scene){
    var COUNT = 22;
    for(var i = 0; i < COUNT; i++){
      var t = i/COUNT;
      var p = pointAt(t);
      var outward = 1.22;
      var geo = new THREE.BoxGeometry(16, 9, 7);
      var mat = new THREE.MeshLambertMaterial({color: i%4===0 ? 0x38424a : 0x252d33});
      var box = new THREE.Mesh(geo, mat);
      box.position.set(p.x*outward, 4.5, p.z*outward);
      box.lookAt(0, 4.5, 0);
      scene.add(box);
    }
  }

  /* =========================================================
     2. ARABALAR — kutu (BoxGeometry) gövde, ağır/geniş stock-car
     oranları. Her karede pist üzerindeki bir sonraki noktaya
     lookAt() ile bakıyor (yaw), ayrıca yerel Z (ilerleme) ekseni
     etrafında bankaja göre yatıyor (roll) — pistin eğimine
     "yapışmış" gibi duruyor.
     ========================================================= */
  function makeCar(color){
    var geo = new THREE.BoxGeometry(5.2, 2.6, 10.5); // genişlik, yükseklik, uzunluk
    var mat = new THREE.MeshLambertMaterial({color:color});
    var mesh = new THREE.Mesh(geo, mat);
    mesh.position.y = 1.5;
    return mesh;
  }

  // Pistin merkez çizgisi üzerindeki bir "t" noktasında yerel çerçeve:
  // teğet (ilerleme yönü), yanal (side, şerit kaydırmak için) ve banking açısı.
  function trackFrameAt(t){
    var p0 = pointAt(t);
    var p1 = pointAt((t + 0.0015) % 1);
    var tangent = new THREE.Vector3(p1.x - p0.x, 0, p1.z - p0.z).normalize();
    var side = new THREE.Vector3().crossVectors(tangent, new THREE.Vector3(0,1,0)).normalize();
    return { x: p0.x, z: p0.z, side: side, bank: bankAt(t) };
  }

  // Merkez çizgiden "laneOffset" kadar yana kaymış, banking'e göre
  // yükselmiş/alçalmış bir dünya konumu — geçiş (overtake) manevraları
  // arabaların pistin farklı şeritlerinde yan yana durmasını sağlıyor.
  var CAR_Y = 1.5;
  function laneOffsetPosition(t, laneOffset){
    var f = trackFrameAt(t);
    var cosB = Math.cos(f.bank), sinB = Math.sin(f.bank);
    return {
      x: f.x + f.side.x*laneOffset*cosB,
      y: CAR_Y + laneOffset*sinB,
      z: f.z + f.side.z*laneOffset*cosB,
      bank: f.bank
    };
  }

  // Şerit seçenekleri: iç / merkez / dış — TRACK_WIDTH=26 içinde güvenli payla.
  var LANES = [-9, -4.5, 0, 4.5, 9]; // 5 şerit — araba pistin tüm genişliğini kullansın
  function pickOtherLane(current){
    var options = LANES.filter(function(l){ return Math.abs(l-current) > 0.01; });
    return options[Math.floor(Math.random()*options.length)];
  }

  // Basit ama etkili geçiş (overtake) yapay zekası: her araba kendi ritminde
  // (senkronize olmayan aralıklarla) önündeki dar bir mesafe/şerit penceresinde
  // başka bir araba var mı diye bakar; varsa farklı bir şeride geçmeyi dener
  // ve geçiş sırasında kısa süreli bir hız artışı (boost) kazanır — gerçek
  // yarışlardaki "slipstream + sollama" hissini taklit ediyor.
  var OVERTAKE_GAP_MIN = 0.004, OVERTAKE_GAP_MAX = 0.03;
  function aiOvertakeCheck(car, allCars, nowMs){
    if(nowMs < car.nextAiCheck) return;
    car.nextAiCheck = nowMs + 1000 + Math.random()*900;
    var myP = car.lapsCompleted + car.t;
    var blocked = false;
    for(var i=0;i<allCars.length;i++){
      var other = allCars[i];
      if(other === car) continue;
      var gap = (other.lapsCompleted + other.t) - myP;
      if(gap > OVERTAKE_GAP_MIN && gap < OVERTAKE_GAP_MAX && Math.abs(other.laneTarget - car.laneTarget) < 3){
        blocked = true; break;
      }
    }
    if(blocked){
      car.laneTarget = pickOtherLane(car.laneTarget);
      car.boosting = true;
      car.boostUntil = nowMs + 1800 + Math.random()*900;
    } else if(car.boosting && nowMs > car.boostUntil){
      car.boosting = false;
    }
  }

  // Araba fiziği: ilerleme (t) + yumuşak şerit geçişi (lane LERP) + banking
  // roll'ü + tur tamamlama tespiti. Hız her karede aynı değer değil; boost
  // (geçiş atağı) sırasında geçici olarak artıyor, sonra normale dönüyor.
  function updateCar(car, dt, nowMs, allCars){
    aiOvertakeCheck(car, allCars, nowMs);

    // şerit hedefine yumuşak (LERP) yaklaşma — ani "ışınlanma" yok
    car.lane += (car.laneTarget - car.lane) * Math.min(1, dt*2.6);

    var speedMul = car.boosting ? 1.09 : 1;
    var prevT = car.t;
    car.t = (car.t + dt*car.tSpeed*speedMul) % 1;
    var lapped = prevT > 0.85 && car.t < 0.15;
    if(lapped) car.lapsCompleted++;

    var pos = laneOffsetPosition(car.t, car.lane);
    var aheadPos = laneOffsetPosition((car.t + 0.01) % 1, car.laneTarget);

    car.mesh.position.set(pos.x, pos.y, pos.z);
    car.mesh.lookAt(aheadPos.x, pos.y, aheadPos.z);
    car.mesh.rotateZ(-pos.bank); // banking ile birlikte yatış (roll) — pist yüzeyiyle aynı yönde

    return lapped;
  }

  /* =========================================================
     3. SAHNE, KAMERA (dramatik stadyum açısı), IŞIK
     ========================================================= */
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0e12);
  scene.fog = new THREE.Fog(0x0a0e12, 320, 620);

  // İzometrik yerine PerspectiveCamera + daha alçak açı: banking artık
  // net görünüyor, perspektif derinliği "stadyum" hissini güçlendiriyor.
  var camera = new THREE.PerspectiveCamera(48, window.innerWidth/window.innerHeight, 1, 2000);
  var camAz = Math.PI/4;              // 45° yatay
  var camEl = THREE.MathUtils.degToRad(20); // alçak, dramatik dikey açı (izometrikte 35.264°'ydi)
  var camDist = 300;

  function updateCameraPosition(){
    camera.position.set(
      camDist*Math.cos(camEl)*Math.sin(camAz),
      camDist*Math.sin(camEl) + 20,
      camDist*Math.cos(camEl)*Math.cos(camAz)
    );
    camera.lookAt(0, 6, 0);
  }
  updateCameraPosition();

  function resize(){
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w/h;
    camera.updateProjectionMatrix();
  }

  // Hafif, gölgesiz ışıklandırma — mobilde ısıtmayacak seviyede
  scene.add(new THREE.AmbientLight(0xffffff, 0.65));
  var sun = new THREE.DirectionalLight(0xffffff, 0.55);
  sun.position.set(120, 200, 80);
  sun.castShadow = false;
  scene.add(sun);

  var renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.shadowMap.enabled = false; // gölgeler kapalı (mobil optimizasyon)
  document.body.appendChild(renderer.domElement);
  window.addEventListener('resize', resize);

  var track = buildBankedTrack();
  scene.add(track.mesh);
  scene.add(buildInfield(track.innerLine));
  scene.add(buildBarrierWall(track.outerRing));
  scene.add(buildGround());
  buildStands(scene);
  buildPitLane(scene);
  scene.add(buildPitRoad().mesh);
  buildGantry(scene);
  buildCrowd(scene);

  // Alan (grid): oyuncu + 5 rakip — farklı renk, hafif farklı temel hız ve
  // başlangıç şeridiyle dağıtılmış, böylece daha ilk turdan geçişler doğal
  // şekilde oluşuyor.
  var CAR_DEFS = [
    { color:0xe0483e, name:'SEN',  isPlayer:true,  t:0.00, tSpeed:1/14.0, lane:0    },
    { color:0x3f6bd8, name:'#12',  isPlayer:false, t:0.07, tSpeed:1/14.6, lane:4.5  },
    { color:0xf2b705, name:'#34',  isPlayer:false, t:0.16, tSpeed:1/13.7, lane:-4.5 },
    { color:0x3fae5c, name:'#07',  isPlayer:false, t:0.28, tSpeed:1/14.9, lane:9    },
    { color:0xb45cff, name:'#88',  isPlayer:false, t:0.44, tSpeed:1/14.2, lane:-9   },
    { color:0xeef3f6, name:'#21',  isPlayer:false, t:0.61, tSpeed:1/15.1, lane:0    }
  ];
  var cars = CAR_DEFS.map(function(def){
    return {
      mesh: makeCar(def.color), color: def.color, name: def.name, isPlayer: def.isPlayer,
      t: def.t, prevT: def.t, tSpeed: def.tSpeed, lapsCompleted: 0,
      lane: def.lane, laneTarget: def.lane, boosting:false, boostUntil:0, nextAiCheck:0
    };
  });
  cars.forEach(function(c){ scene.add(c.mesh); });

  resize();

  /* =========================================================
     3b. TUR KAZANCI — oyuncunun (kırmızı) arabası start/finish
     noktasından (t=1 -> 0 sarımı) her geçtiğinde para kazandırır.
     ========================================================= */
  var moneyAmountEl = document.getElementById('money-amount');
  var lapRewardEl = document.getElementById('lap-reward');
  lapRewardEl.textContent = formatMoney(LAP_REWARD);

  function renderMoney(){
    moneyAmountEl.textContent = formatMoney(state.money);
  }

  function spawnLapPop(text){
    var el = document.createElement('div');
    el.className = 'lap-pop';
    el.textContent = text;
    el.style.left = '50%';
    el.style.top = '90px';
    document.body.appendChild(el);
    setTimeout(function(){ el.remove(); }, 820);
  }

  function onLapCompleted(){
    state.money += LAP_REWARD;
    renderMoney();
    spawnLapPop('+' + formatMoney(LAP_REWARD) + ' — TUR TAMAMLANDI');
    Sound.lap();
    saveState();
  }

  /* =========================================================
     3d. SIRALAMA (standings) — toplam mesafeye (tamamlanan tur + t)
     göre sıralanıyor; bu değer hem doğru sırayı hem de geçiş (gap)
     hesaplarını turun sarma noktasından etkilenmeden veriyor.
     ========================================================= */
  var standingsEl = document.getElementById('standings');
  var lastPlayerPos = null;

  function computeStandings(){
    var ranked = cars.slice().sort(function(a,b){
      return (b.lapsCompleted + b.t) - (a.lapsCompleted + a.t);
    });
    return ranked;
  }

  function renderStandings(ranked){
    var html = '';
    for(var i=0;i<ranked.length;i++){
      var c = ranked[i];
      html += '<div class="stand-row' + (c.isPlayer?' me':'') + '">' +
        '<span class="pos">' + (i+1) + '</span>' +
        '<span class="dot" style="background:#' + c.color.toString(16).padStart(6,'0') + '"></span>' +
        '<span>' + c.name + '</span></div>';
    }
    standingsEl.innerHTML = html;
  }

  function checkPlayerOvertake(ranked){
    var pos = ranked.findIndex(function(c){ return c.isPlayer; }) + 1;
    if(lastPlayerPos !== null && pos < lastPlayerPos){
      Sound.overtake();
      var el = document.createElement('div');
      el.className = 'lap-pop overtake';
      el.textContent = 'GEÇİŞ! P' + pos;
      el.style.left = '50%';
      el.style.top = '90px';
      document.body.appendChild(el);
      setTimeout(function(){ el.remove(); }, 820);
    }
    lastPlayerPos = pos;
  }

  /* =========================================================
     3c. ÇEVRİMDIŞI KAZANÇ — sahne kurulduktan (cars hazır olduktan)
     sonra hesaplanır, böylece tur süresi/ödül oranıyla tutarlı olur.
     ========================================================= */
  (function applyOfflineEarnings(){
    var result = creditOfflineEarnings();
    renderMoney();
    saveState(); // lastSeenAt'i hemen diske yaz — açılışın hemen ardından kapatılsa bile kaybolmasın
    if(result && result.earned > 0){
      var toast = document.getElementById('offline-toast');
      var mins = Math.round(result.seconds/60);
      toast.textContent = 'Çevrimdışı kazanç: +' + formatMoney(result.earned) +
        ' (' + mins + ' dk)' + (result.capped ? ' — üst sınıra ulaşıldı' : '');
      toast.classList.add('show');
      setTimeout(function(){ toast.classList.remove('show'); }, 4200);
    }
  })();

  /* =========================================================
     3e. AYARLAR PANELİ — önceki oyundan (Gaza Bas) taşınan arayüz
     dili: dişli düğme, tam ekran panel, tek anahtar (ses aç/kapat).
     ========================================================= */
  var settingsOpenBtn = document.getElementById('settings-open');
  var settingsCloseBtn = document.getElementById('settings-close');
  var settingsPanel = document.getElementById('settings-panel');
  var soundSwitch = document.getElementById('sound-switch');

  settingsOpenBtn.addEventListener('click', function(){ settingsPanel.hidden = false; });
  settingsCloseBtn.addEventListener('click', function(){ settingsPanel.hidden = true; });
  soundSwitch.classList.toggle('on', state.soundOn);
  soundSwitch.addEventListener('click', function(){
    state.soundOn = !state.soundOn;
    soundSwitch.classList.toggle('on', state.soundOn);
    saveState();
    if(state.soundOn) Sound.ensureCtx();
  });

  // Düzenli kayıt: sekme kapansa/arka plana atılsa bile lastSeenAt güncel
  // kalsın — bir sonraki açılışta doğru süre hesaplanabilsin.
  setInterval(saveState, 5000);
  document.addEventListener('visibilitychange', function(){
    if(document.hidden){ state.lastSeenAt = TrustedClock.now().time; saveState(); }
  });
  window.addEventListener('beforeunload', function(){
    state.lastSeenAt = TrustedClock.now().time; saveState();
  });

  /* =========================================================
     4. GAME LOOP — requestAnimationFrame, delta-time tabanlı
     ========================================================= */
  var lastTime = null;
  var standingsTimer = 0;
  var STANDINGS_INTERVAL = 280; // ms — her karede DOM'a yazmaya gerek yok

  function loop(now){
    var dt = lastTime ? Math.min(0.05, (now-lastTime)/1000) : 1/60;
    lastTime = now;

    cars.forEach(function(c){
      var lapped = updateCar(c, dt, now, cars);
      if(c.isPlayer && lapped) onLapCompleted();
    });

    standingsTimer += dt*1000;
    if(standingsTimer >= STANDINGS_INTERVAL){
      standingsTimer = 0;
      var ranked = computeStandings();
      renderStandings(ranked);
      checkPlayerOvertake(ranked);
    }

    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }

  renderStandings(computeStandings());
  renderMoney();
  document.getElementById('status').textContent = 'Sahne hazır.';
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
