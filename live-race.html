<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B0E14">
<meta name="color-scheme" content="dark">
<title>Canlı Yarış Simülasyonu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Saira:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#0B0E14; --bg-1:#0f131a; --bg-2:#151b24; --bg-3:#1c2430; --bg-4:#27313d;
  --line:#2a3441; --line-soft:#1c2430;
  --text:#eef3f8; --text-dim:#93a4b8; --text-mute:#5c6c80;
  --cyan:#00F0FF; --race-red:#FF334B;
  --ev-overtake:#22c55e; --ev-flag:#ffce3d; --ev-dnf:#ff334b; --ev-radio:#4f8cff; --ev-pit:#00F0FF;
  --c-soft:#E10600; --c-medium:#FFD800; --c-hard:#FFFFFF; --c-inter:#39B54A; --c-wet:#0072C6;
  --f-display:'Saira Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'Saira',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono','Consolas',ui-monospace,monospace;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg-0);color:var(--text);font-family:var(--f-body);-webkit-font-smoothing:antialiased}
body{
  min-height:100vh;touch-action:manipulation;
  background:
    radial-gradient(110% 45% at 90% -8%, rgba(0,240,255,.07), transparent 55%),
    radial-gradient(90% 45% at 0% 105%, rgba(255,51,75,.07), transparent 55%),
    linear-gradient(180deg,var(--bg-1),var(--bg-0));
  padding-bottom:calc(var(--safe-b) + 18px);
}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;touch-action:manipulation}
.mono{font-family:var(--f-mono)}
.tier-good{color:var(--ev-overtake)} .tier-warn{color:var(--ev-flag)} .tier-bad{color:var(--ev-dnf)}

/* =========================================================
   ÜST BAR
   ========================================================= */
.top-bar{
  position:sticky;top:0;z-index:6;
  padding:calc(var(--safe-t) + 10px) calc(var(--safe-r) + 14px) 12px calc(var(--safe-l) + 14px);
  background:linear-gradient(180deg,rgba(11,14,20,.97),rgba(11,14,20,.9));
  border-bottom:1px solid var(--line);backdrop-filter:blur(8px);
}
.top-row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;flex-wrap:wrap}
.eyebrow{font-size:10px;letter-spacing:.2em;color:var(--cyan);font-weight:800;text-transform:uppercase}
.title{font-family:var(--f-display);font-weight:800;font-size:21px;text-transform:uppercase;letter-spacing:.01em;margin-top:2px;display:flex;align-items:center;gap:8px}
.status-badge{
  display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;
  font-family:var(--f-mono);font-size:10.5px;font-weight:700;letter-spacing:.04em;
  background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.4);color:var(--ev-overtake);
}
.status-badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.status-badge.is-flag{background:rgba(255,206,61,.14);border-color:rgba(255,206,61,.5);color:var(--ev-flag)}
.status-badge.is-dnf{background:rgba(255,51,75,.14);border-color:rgba(255,51,75,.5);color:var(--ev-dnf)}
.status-badge.is-finish{background:rgba(0,240,255,.14);border-color:rgba(0,240,255,.5);color:var(--cyan)}

.summary-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sum-chip{flex:1;min-width:76px;background:var(--bg-3);border:1px solid var(--line);border-radius:9px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.sum-chip .l{font-size:8px;letter-spacing:.09em;color:var(--text-mute);text-transform:uppercase;font-weight:700}
.sum-chip .v{font-family:var(--f-mono);font-size:14px;font-weight:700}
.sum-chip.is-hot .v{color:var(--race-red)}
.sum-chip.is-fast .v{color:var(--cyan)}

.sim-toolbar{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.tool-btn{
  flex:1;min-width:70px;padding:8px 6px;border-radius:8px;border:1px solid var(--line);background:var(--bg-3);
  font-family:var(--f-display);font-weight:700;font-size:11px;letter-spacing:.04em;text-transform:uppercase;
  color:var(--text-dim);text-align:center;
}
.tool-btn.is-active{background:linear-gradient(180deg,rgba(0,240,255,.2),rgba(0,240,255,.06));border-color:var(--cyan);color:var(--text)}

main{padding:16px calc(var(--safe-r) + 14px) 0 calc(var(--safe-l) + 14px);max-width:1200px;margin:0 auto}
.section-label{
  display:flex;align-items:center;gap:8px;margin-bottom:10px;
  font-family:var(--f-display);font-weight:700;font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--text-dim);padding-left:9px;border-left:3px solid var(--cyan);
}

/* =========================================================
   PİLOT TALİMAT BUTONLARI
   ========================================================= */
.cmd-card{
  background:linear-gradient(160deg,var(--bg-2),var(--bg-1));border:1px solid var(--line);
  border-radius:14px;padding:12px;margin-bottom:18px;box-shadow:0 10px 24px rgba(0,0,0,.35);
}
.cmd-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.cmd-head b{font-family:var(--f-display);font-weight:800;font-size:13px;text-transform:uppercase}
.cmd-head span{font-family:var(--f-mono);font-size:10px;color:var(--text-mute)}
.cmd-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
@media(min-width:560px){ .cmd-grid{grid-template-columns:repeat(4,1fr)} }
.cmd-btn{
  padding:12px 6px;border-radius:10px;border:1px solid var(--line);background:var(--bg-3);
  font-family:var(--f-display);font-weight:800;font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;
  text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:transform .08s ease,opacity .15s ease;
}
.cmd-btn:active{transform:scale(.95)}
.cmd-btn .ic{font-size:16px}
.cmd-btn[data-cmd="pit"]{border-color:rgba(0,240,255,.4)} .cmd-btn[data-cmd="pit"] .ic,.cmd-btn[data-cmd="pit"] b{color:var(--cyan)}
.cmd-btn[data-cmd="agresif"]{border-color:rgba(255,51,75,.4)} .cmd-btn[data-cmd="agresif"] .ic,.cmd-btn[data-cmd="agresif"] b{color:var(--race-red)}
.cmd-btn[data-cmd="koru"]{border-color:rgba(34,197,94,.4)} .cmd-btn[data-cmd="koru"] .ic,.cmd-btn[data-cmd="koru"] b{color:var(--ev-overtake)}
.cmd-btn[data-cmd="push"]{border-color:rgba(79,140,255,.4)} .cmd-btn[data-cmd="push"] .ic,.cmd-btn[data-cmd="push"] b{color:var(--ev-radio)}
.cmd-btn.is-locked{opacity:.4;pointer-events:none}
.cmd-btn.is-active-mode{outline:2px solid currentColor;outline-offset:-2px}
.cmd-sub{font-size:8px;color:var(--text-mute);font-weight:600}

/* =========================================================
   ANA IZGARA — sıralama + telsiz akışı
   ========================================================= */
.race-grid{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:980px){ .race-grid{grid-template-columns:1.35fr 1fr} }

/* =========================================================
   YATAY EKRAN (LANDSCAPE) — Orta: Sıralama & Zamanlama
   Sağ: Telsiz Akışı & Strateji Talimat Butonları
   ========================================================= */
@media (orientation:landscape) and (min-width:560px){
  html,body{height:100%}
  body{display:flex;flex-direction:column;overflow:hidden;padding-bottom:0}
  .top-bar{flex:0 0 auto}
  main{max-width:1400px;flex:1;min-height:0;display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .cmd-card{flex:0 0 auto}
  .race-grid{flex:1;min-height:280px;display:grid;grid-template-columns:1.3fr 1fr;gap:12px 16px}
  .board{display:flex;flex-direction:column;min-height:0}
  .board-list{flex:1;max-height:none}
  .feed-card{min-height:0}
  .feed-list{max-height:none}
}

/* Kısa yükseklikli yatay ekranlar (telefon yan yatık) — üst barı sıkıştır */
@media (orientation:landscape) and (max-height:520px){
  .top-bar{padding-top:calc(var(--safe-t) + 6px);padding-bottom:6px}
  .eyebrow{display:none}
  .title{font-size:16px;margin-top:0}
  .summary-row{margin-top:6px;gap:6px}
  .sum-chip{padding:4px 8px}
  .sum-chip .v{font-size:12px}
  .sim-toolbar{margin-top:6px}
  .tool-btn{padding:5px 6px;font-size:9.5px}
  main{padding-top:8px}
  .cmd-card{padding:8px;margin-bottom:8px}
  .cmd-head{margin-bottom:5px}
  .cmd-btn{padding:7px 6px;gap:1px}
  .cmd-btn .ic{font-size:13px}
  .cmd-btn b{font-size:10px}
}


/* --- sıralama tablosu --- */
.board{
  background:linear-gradient(180deg,var(--bg-3),var(--bg-2));border:1px solid var(--line);
  border-radius:14px;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.35);
}
.board-head{
  display:grid;grid-template-columns:22px 4px 1fr 66px 54px;gap:8px;align-items:center;
  padding:7px 10px;border-bottom:1px solid var(--line);
  font-size:8.5px;letter-spacing:.07em;color:var(--text-mute);text-transform:uppercase;font-weight:700;
}
.board-list{max-height:640px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.row{
  display:grid;grid-template-columns:22px 4px 1fr 66px 54px;gap:8px;align-items:center;
  padding:7px 10px;border-bottom:1px solid var(--line-soft);transition:background .3s ease;
}
.row.is-player{background:linear-gradient(90deg,rgba(0,240,255,.09),transparent)}
.row.is-dnf{opacity:.45}
.row .pos{font-family:var(--f-mono);font-weight:700;font-size:12px;color:var(--text-dim);text-align:center}
.row.is-player .pos{color:var(--text)}
.row .bar{width:4px;height:24px;border-radius:2px;background:var(--tc,#666)}
.row .drv{min-width:0;display:flex;flex-direction:column;line-height:1.2}
.row .drv b{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .drv span{font-size:8.5px;color:var(--text-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .lap{font-family:var(--f-mono);font-size:11.5px;font-weight:700;text-align:right}
.row .lap small{display:block;font-size:8px;color:var(--text-mute);font-weight:600;text-align:right}
.tyre-cell{display:flex;flex-direction:column;align-items:center;gap:2px}
.tyre-badge{
  width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;
  font-family:var(--f-mono);font-weight:800;font-size:10px;border:1px solid var(--line);
}
.wear-bar{width:36px;height:4px;border-radius:99px;background:var(--bg-4);overflow:hidden}
.wear-bar i{display:block;height:100%}
.pit-tag{font-size:7.5px;font-weight:800;color:var(--cyan);letter-spacing:.05em}

/* --- telsiz & olay akışı --- */
.feed-card{
  background:linear-gradient(180deg,var(--bg-3),var(--bg-2));border:1px solid var(--line);
  border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 10px 24px rgba(0,0,0,.35);
}
.feed-head{
  display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);
  font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-dim);
}
.feed-legend{display:flex;gap:7px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line-soft)}
.feed-legend .li{display:flex;align-items:center;gap:3px;font-size:8.5px;color:var(--text-mute)}
.feed-legend .dot{width:7px;height:7px;border-radius:50%}
.feed-list{max-height:560px;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 0;display:flex;flex-direction:column;gap:1px}
.feed-row{display:flex;gap:8px;padding:6px 12px;border-left:3px solid var(--line);animation:feedIn .18s ease-out}
@keyframes feedIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:translateY(0)}}
.feed-row.ev-overtake{border-left-color:var(--ev-overtake)}
.feed-row.ev-flag{border-left-color:var(--ev-flag)}
.feed-row.ev-dnf{border-left-color:var(--ev-dnf)}
.feed-row.ev-radio{border-left-color:var(--ev-radio)}
.feed-row.ev-pit{border-left-color:var(--ev-pit)}
.feed-row .lap-tag{font-family:var(--f-mono);font-size:9.5px;color:var(--text-mute);flex:0 0 auto;padding-top:1px}
.feed-row .msg{font-size:11.5px;color:var(--text);line-height:1.4}
</style>
</head>
<body>

<header class="top-bar">
  <span class="eyebrow">Paddock GP · Pit Duvarı</span>
  <div class="top-row">
    <h1 class="title">Canlı Yarış <span class="status-badge" id="ui-status-badge"><span class="dot"></span><span id="ui-status-text">Yeşil Bayrak</span></span></h1>
  </div>
  <div class="summary-row">
    <div class="sum-chip"><span class="l">🏁 Tur</span><span class="v mono" id="ui-lap">—</span></div>
    <div class="sum-chip"><span class="l">☀️ Hava</span><span class="v" id="ui-weather">—</span></div>
    <div class="sum-chip is-hot"><span class="l">🌡 Pist Sıc.</span><span class="v mono" id="ui-temp">—</span></div>
    <div class="sum-chip is-fast"><span class="l">⚡ Hızlı Tur</span><span class="v mono" id="ui-fastlap">—</span></div>
  </div>
  <div class="sim-toolbar">
    <button class="tool-btn is-active" id="btn-playpause" type="button">⏸ Duraklat</button>
    <button class="tool-btn" id="btn-speed" type="button">Hız: 1×</button>
    <button class="tool-btn" id="btn-restart" type="button">↺ Yeniden Başlat</button>
  </div>
</header>

<main>
  <div class="cmd-card">
    <div class="cmd-head"><b>Anlık Talimat — <span id="ui-player-name">—</span></b><span id="ui-player-mode">DENGELİ</span></div>
    <div class="cmd-grid">
      <button class="cmd-btn" data-cmd="pit" type="button"><span class="ic">🔧</span><b>Pite Gir</b></button>
      <button class="cmd-btn" data-cmd="agresif" type="button"><span class="ic">🔥</span><b>Agresif Mod</b></button>
      <button class="cmd-btn" data-cmd="koru" type="button"><span class="ic">🛡️</span><b>Lastik Koru</b></button>
      <button class="cmd-btn" data-cmd="push" type="button"><span class="ic">🔋</span><b>Batarya Boşalt</b><span class="cmd-sub" id="ui-push-sub">(Push)</span></button>
    </div>
  </div>

  <div class="race-grid">
    <section>
      <div class="section-label">Canlı Sıralama</div>
      <div class="board">
        <div class="board-head"><span></span><span></span><span>Pilot</span><span style="text-align:right">Son Tur</span><span style="text-align:center">Lastik</span></div>
        <div class="board-list" id="board-list"></div>
      </div>
    </section>
    <section>
      <div class="section-label">Telsiz &amp; Olay Akışı</div>
      <div class="feed-card">
        <div class="feed-head">Canlı Akış <span class="mono" style="font-size:9px;color:var(--text-mute)" id="ui-event-count">0 olay</span></div>
        <div class="feed-legend">
          <span class="li"><span class="dot" style="background:var(--ev-overtake)"></span>Geçiş</span>
          <span class="li"><span class="dot" style="background:var(--ev-flag)"></span>Bayrak/GA</span>
          <span class="li"><span class="dot" style="background:var(--ev-dnf)"></span>DNF/Kaza</span>
          <span class="li"><span class="dot" style="background:var(--ev-radio)"></span>Telsiz</span>
          <span class="li"><span class="dot" style="background:var(--ev-pit)"></span>Pit</span>
        </div>
        <div class="feed-list" id="feed-list"></div>
      </div>
    </section>
  </div>
</main>

<script src="f1-2026-data.js"></script>
<script>
(function(){
'use strict';

/* =========================================================
   1. SABİTLER
   ========================================================= */
var TEAM_COLORS={ PAD1:'#ff1744', PAD2:'#00e5ff', RBR:'#3671c6', FER:'#e8002d', MER:'#00d7b6', MCL:'#ff8000', AST:'#229971', ALP:'#0093cc', WIL:'#64c4ff', HAA:'#b6babd' };
var COMPOUND_WEAR={ S:1.55, M:1.0, H:0.65, I:0.85, W:0.6 };
var MODE_PACE={ Agresif:1.032, Dengeli:1.0, Tasarruf:0.965 };
var MODE_WEAR={ Agresif:1.35, Dengeli:1.0, Tasarruf:0.68 };
var CORNERS=['1. Virajda','4. Viraj çıkışında','Ana düzlükte DRS ile','Şikanda','Son virajda','Fren noktasında','İç çizgiden'];
var RADIO_LINES=[
  "Ön lastiklerde hafif kabarma hissediyorum.",
  "Motor sıcaklığı normal, her şey yolunda.",
  "Arkamdaki araç DRS mesafesinde, dikkatli olacağım.",
  "Bu tur biraz trafik yaşadım, zaman kaybettim.",
  "Denge iyi, öndeki arabaya yaklaşabiliyorum.",
  "Lastik sıcaklıkları ideal aralıkta.",
  "Fren balatalarında hafif bir titreşim var.",
  "Viraj çıkışlarında hafif savruluyorum, kontrol ediyorum.",
  "Pist tutuşu bu turda biraz daha iyi.",
  "Yakıt karışımını ayarlayabilir miyiz?"
];
var DNF_REASONS=[
  {type:'crash', text:'KAZA! {n} pist kenarına çarptı ve yarışı sonlandırmak zorunda kaldı.'},
  {type:'mech', text:'MEKANİK ARIZA! {n}\'ın aracından duman yükseliyor, yarışı bırakıyor.'},
  {type:'mech', text:'ŞANZIMAN SORUNU! {n} yarışa devam edemiyor.'},
  {type:'mech', text:'MOTOR ARIZASI! {n} aracını pit yoluna park etmek zorunda kaldı.'}
];
var ROSTER=[
  {code:'PAD1', displayCode:'PAD1', name:'Marcus Vance', pace:85, perf:83, cons:80, isPlayer:true},
  {code:'PAD2', displayCode:'PAD2', name:'Elena Torres', pace:77, perf:83, cons:85, isPlayer:false},
  {code:'RBR', displayCode:'RBR', name:'Voss', pace:88, perf:90, cons:84, isPlayer:false},
  {code:'FER', displayCode:'FER', name:'Moretti', pace:84, perf:87, cons:78, isPlayer:false},
  {code:'MER', displayCode:'MER', name:'Hallberg', pace:80, perf:82, cons:88, isPlayer:false},
  {code:'MCL', displayCode:'MCL', name:'Prince', pace:82, perf:85, cons:81, isPlayer:false},
  {code:'AST', displayCode:'AST', name:'Costa', pace:76, perf:78, cons:83, isPlayer:false},
  {code:'ALP', displayCode:'ALP', name:'Duval', pace:74, perf:75, cons:79, isPlayer:false},
  {code:'WIL', displayCode:'WIL', name:'Garcia', pace:71, perf:70, cons:82, isPlayer:false},
  {code:'HAA', displayCode:'HAA', name:'Klein', pace:70, perf:68, cons:77, isPlayer:false}
];
var BASE_LAP_TIME=92; // saniye
var TOTAL_LAPS=57;
var PIT_LOSS_SECONDS=22.4;
var TRACK_TEMP='31°C';
var COMPOUND_ORDER=['S','M','H'];

/* =========================================================
   GERÇEK 2026 KADRO ENTEGRASYONU
   f1-2026-data.js yüklüyse: oyuncunun takımından 2 gerçek pilot (iç
   kimlik anahtarı yine 'PAD1'/'PAD2' — tüm simülasyon mantığı bu
   anahtarlara göre çalıştığından değişmez, sadece görünen isim/kod/
   renk gerçek veriden gelir), 8 rakip gerçek takımdan birer pilot,
   ve takvimden gerçek pist (tur, baz tur süresi, pit kaybı) kullanılır.
   ========================================================= */
var PLAYER_TEAM_ID='MCL';
(function applyRealRoster(){
  if(!window.F1_2026_DATA) return;
  var master=window.F1_2026_DATA;
  var playerTeam=master.teams.filter(function(t){ return t.id===PLAYER_TEAM_ID; })[0];
  var track=master.calendar.filter(function(r){ return r.round===1; })[0];
  if(!playerTeam || !track) return;

  function driverById(id){ return master.drivers.filter(function(d){ return d.id===id; })[0]; }
  function toEntry(md,code,isPlayer){
    var s=md.stats;
    return { code:code, displayCode:md.code, name:md.name, pace:s.pace, perf:Math.round((s.overtaking+s.tyre_management)/2), cons:s.consistency, isPlayer:isPlayer };
  }

  var roster=[ toEntry(driverById(playerTeam.driver_ids[0]),'PAD1',true), toEntry(driverById(playerTeam.driver_ids[1]),'PAD2',false) ];
  var teamColors={ PAD1:playerTeam.color_primary, PAD2:playerTeam.color_secondary };
  var rivalIds=['RBR','FER','MER','MCL','AST','ALP','WIL','HAA','RB','AUD','CAD'].filter(function(id){ return id!==PLAYER_TEAM_ID; }).slice(0,8);
  rivalIds.forEach(function(tid){
    var team=master.teams.filter(function(t){ return t.id===tid; })[0];
    if(!team) return;
    roster.push(toEntry(driverById(team.driver_ids[0]),tid,false));
    teamColors[tid]=team.color_primary;
  });

  ROSTER=roster;
  TEAM_COLORS=teamColors;
  BASE_LAP_TIME=track.base_lap_time_sec;
  TOTAL_LAPS=track.laps;
  PIT_LOSS_SECONDS=track.pit_loss_sec;
})();

/* =========================================================
   2. YARDIMCILAR
   ========================================================= */
function fmtLap(sec){
  if(!isFinite(sec)||sec<=0) return '--:--.---';
  var m=Math.floor(sec/60), s=sec-m*60;
  return m+':'+(s<10?'0':'')+s.toFixed(3);
}
function fmtDelta(sec){ return (sec>=0?'+':'')+sec.toFixed(3); }
function wearTier(pct){ return pct>=80?'bad':(pct>=60?'warn':'good'); }
function wearColor(pct){ return pct>=80?'var(--ev-dnf)':(pct>=60?'var(--ev-flag)':'var(--ev-overtake)'); }

/* =========================================================
   3. YARIŞ SİMÜLASYON MOTORU
   ========================================================= */
function YarisSimulasyonu(){
  this.currentLap=0;
  this.totalLaps=TOTAL_LAPS;
  this.trackStatus='Yeşil Bayrak';
  this.statusLapsRemaining=0;
  this.weather='Kuru';
  this.trackTemp=TRACK_TEMP;
  this.finished=false;
  this.fastestLap=null; // {code,name,time}
  this.events=[];
  this.eventSeq=0;
  this.incidentCooldown=6;

  this.drivers=ROSTER.map(function(r,i){
    return {
      code:r.code, displayCode:r.displayCode||r.code, name:r.name, isPlayer:r.isPlayer,
      pace:r.pace, perf:r.perf, consistency:r.cons,
      mode:'Dengeli', compound: i%3===0?'M':(i%3===1?'S':'H'),
      tireWear:0, lapsUsed:0,
      totalTime:0, lastLapTime:null,
      pitting:false, pitTimer:0, pitStops:0,
      pushBoost:false, pushCooldown:0,
      dnf:false, dnfLap:null,
      grid:i+1
    };
  });
  this.order=this.drivers.slice().sort(function(){ return Math.random()-0.5; });
}

YarisSimulasyonu.prototype._pushEvent=function(type,message){
  this.eventSeq++;
  var ev={ id:this.eventSeq, lap:this.currentLap, type:type, message:message };
  this.events.push(ev);
  if(this.events.length>200) this.events.shift();
  return ev;
};

YarisSimulasyonu.prototype._tyreDegPenalty=function(wear){
  if(wear<=70) return wear*0.014;
  return 70*0.014 + (wear-70)*0.05;
};
YarisSimulasyonu.prototype._fuelEffect=function(){
  var MAX=1.1;
  return MAX*(1-this.currentLap/this.totalLaps);
};
YarisSimulasyonu.prototype._randomDeviation=function(consistency){
  return (Math.random()*2-1)*(1-consistency/100)*1.3;
};

YarisSimulasyonu.prototype._lapTimeFor=function(driver){
  var t=BASE_LAP_TIME;
  t -= (driver.pace-70)*0.028;
  t -= (driver.perf-70)*0.022;
  t += this._tyreDegPenalty(driver.tireWear);
  t += this._fuelEffect();
  t += this._randomDeviation(driver.consistency);
  t /= (MODE_PACE[driver.mode]||1);
  if(driver.pushBoost){ t -= 0.55; driver.pushBoost=false; }
  if(this.trackStatus==='Güvenlik Aracı') t *= 1.85;
  else if(this.trackStatus==='Sanal Güvenlik Aracı') t *= 1.35;
  return Math.max(t, BASE_LAP_TIME*0.75);
};

YarisSimulasyonu.prototype._degradeTyre=function(driver){
  var wearGain=(COMPOUND_WEAR[driver.compound]||1)*(MODE_WEAR[driver.mode]||1)*1.35;
  driver.tireWear=Math.min(100,driver.tireWear+wearGain);
  driver.lapsUsed+=1;
};

YarisSimulasyonu.prototype.callPit=function(driver,compound,playerInitiated){
  if(driver.pitting||driver.dnf) return;
  driver.pitting=true;
  driver._nextCompound=compound;
  driver.totalTime+=PIT_LOSS_SECONDS*(this.trackStatus==='Güvenlik Aracı'?0.5:(this.trackStatus==='Sanal Güvenlik Aracı'?0.65:1));
  driver.pitting=false;
  driver.compound=compound;
  driver.tireWear=0;
  driver.lapsUsed=0;
  driver.pitStops+=1;
  if(playerInitiated) this._pushEvent('pit','🔧 Pite Gir talimatı — '+driver.name+' pit yoluna giriyor, '+compound+' lastiklere geçiyor.');
  else this._pushEvent('pit','🔧 '+driver.name+' pit yaptı — yeni lastik: '+compound+'.');
};

YarisSimulasyonu.prototype._aiPitDecision=function(driver){
  if(driver.dnf||driver.pitting) return;
  var chance=0;
  if(driver.tireWear>72) chance+=0.05;
  if(driver.tireWear>90) chance+=0.22;
  if(driver.pitStops===0 && this.currentLap>this.totalLaps*0.55) chance+=0.02;
  if(this.totalLaps-this.currentLap<=2 && driver.pitStops===0) chance=1;
  if(Math.random()<chance){
    var idx=COMPOUND_ORDER.indexOf(driver.compound);
    var next=COMPOUND_ORDER[(idx+1)%COMPOUND_ORDER.length];
    this.callPit(driver,next,false);
  }
};

YarisSimulasyonu.prototype._maybeIncident=function(){
  if(this.trackStatus!=='Yeşil Bayrak'){
    this.statusLapsRemaining--;
    if(this.statusLapsRemaining<=0){
      this.trackStatus='Yeşil Bayrak';
      this._pushEvent('flag','🟢 Pist temiz — yarış YEŞİL BAYRAK ile devam ediyor.');
    }
    return;
  }
  this.incidentCooldown--;
  if(this.incidentCooldown>0) return;
  this.incidentCooldown=14+Math.floor(Math.random()*16);
  if(Math.random()<0.16){
    var active=this.drivers.filter(function(d){return !d.dnf;});
    var victim=active[Math.floor(Math.random()*active.length)];
    var reason=DNF_REASONS[Math.floor(Math.random()*DNF_REASONS.length)];
    victim.dnf=true;
    victim.dnfLap=this.currentLap;
    this._pushEvent('dnf','💥 '+reason.text.replace('{n}',victim.name)+' (Tur '+this.currentLap+')');
    if(Math.random()<0.55){
      var isSC=reason.type==='crash'&&Math.random()<0.4;
      this.trackStatus=isSC?'Güvenlik Aracı':'Sanal Güvenlik Aracı';
      this.statusLapsRemaining=isSC?(4+Math.floor(Math.random()*4)):(3+Math.floor(Math.random()*3));
      this._pushEvent('flag', (isSC?'🟡 GÜVENLİK ARACI (GA) piste çıktı!':'🟡 SANAL GÜVENLİK ARACI (VSC) devrede.'));
    }
  }
};

YarisSimulasyonu.prototype._maybeRadio=function(){
  if(Math.random()<0.32){
    var active=this.drivers.filter(function(d){return !d.dnf;});
    var d=active[Math.floor(Math.random()*active.length)];
    var line=RADIO_LINES[Math.floor(Math.random()*RADIO_LINES.length)];
    this._pushEvent('radio','📻 Telsiz - '+d.name+': "'+line+'"');
  }
};

YarisSimulasyonu.prototype._checkOvertakes=function(prevOrder,newOrder){
  if(this.trackStatus!=='Yeşil Bayrak') return;
  for(var i=0;i<newOrder.length-1;i++){
    if(newOrder[i]===prevOrder[i+1] && newOrder[i+1]===prevOrder[i]){
      var a=this.drivers.filter(function(d){return d.code===newOrder[i];})[0];
      var b=this.drivers.filter(function(d){return d.code===newOrder[i+1];})[0];
      if(a && b && !a.pitting && !b.pitting){
        var corner=CORNERS[Math.floor(Math.random()*CORNERS.length)];
        this._pushEvent('overtake','🏎️ '+a.name+' '+corner+' '+b.name+'\'yi geçti!');
      }
    }
  }
};

YarisSimulasyonu.prototype.playerCommand=function(cmd){
  var player=this.drivers.filter(function(d){return d.isPlayer && d.code==='PAD1';})[0];
  if(!player||player.dnf||this.finished) return;
  if(cmd==='pit'){
    var idx=COMPOUND_ORDER.indexOf(player.compound);
    var next=COMPOUND_ORDER[(idx+1)%COMPOUND_ORDER.length];
    this.callPit(player,next,true);
  } else if(cmd==='agresif'){
    player.mode='Agresif';
    this._pushEvent('radio','📻 '+player.name+' · Agresif moda geçildi.');
  } else if(cmd==='koru'){
    player.mode='Tasarruf';
    this._pushEvent('radio','📻 '+player.name+' · Lastik Koru modu devrede.');
  } else if(cmd==='push'){
    if(player.pushCooldown>0) return;
    player.pushBoost=true;
    player.pushCooldown=3;
    this._pushEvent('radio','📻 '+player.name+' · Batarya boşaltılıyor (PUSH)! Ekstra performans bir sonraki turda.');
  }
};

YarisSimulasyonu.prototype.tick=function(){
  if(this.finished) return;
  this.currentLap++;

  var prevOrder=this.order.map(function(d){return d.code;});

  this.drivers.forEach(function(d){
    if(d.dnf) return;
    var lapT=this._lapTimeFor(d);
    d.totalTime+=lapT;
    d.lastLapTime=lapT;
    this._degradeTyre(d);
    if(d.pushCooldown>0) d.pushCooldown--;
    if(!this.fastestLap || lapT<this.fastestLap.time){ this.fastestLap={code:d.displayCode||d.code,name:d.name,time:lapT}; }
    if(!d.isPlayer || d.code!=='PAD1') this._aiPitDecision(d);
  },this);

  this.order=this.drivers.slice().sort(function(a,b){
    if(a.dnf && b.dnf) return (b.dnfLap-a.dnfLap);
    if(a.dnf) return 1;
    if(b.dnf) return -1;
    return a.totalTime-b.totalTime;
  });

  this._checkOvertakes(prevOrder, this.order.map(function(d){return d.code;}));
  this._maybeIncident();
  this._maybeRadio();

  if(this.currentLap>=this.totalLaps){
    this.finished=true;
    this.trackStatus='Bitiş Bayrağı';
    var winner=this.order.filter(function(d){return !d.dnf;})[0];
    this._pushEvent('flag','🏁 KAREKARE BAYRAK — '+(winner?winner.name:'—')+' yarışı kazandı!');
  }
};

YarisSimulasyonu.prototype.getSnapshot=function(){
  var self=this;
  var leaderboard=this.order.map(function(d,i){
    var leader=self.order.filter(function(x){return !x.dnf;})[0];
    var ahead=i>0?self.order[i-1]:null;
    var gap = d.dnf?'DNF':(d===leader?'LİDER':fmtDelta(d.totalTime-leader.totalTime));
    var interval = d.dnf?'--':(!ahead||ahead===d?'--':fmtDelta(d.totalTime-ahead.totalTime));
    return {
      position:i+1, driver_name:d.name, team_code:d.code,
      gap:gap, interval:interval,
      last_lap: d.lastLapTime?fmtLap(d.lastLapTime):'--:--.---',
      tyre:{ compound:d.compound, wear_percent:Math.round(d.tireWear), laps_used:d.lapsUsed }
    };
  });
  return {
    race_state:{ current_lap:this.currentLap, total_laps:this.totalLaps, track_status:this.trackStatus, weather:this.weather, track_temp:this.trackTemp },
    leaderboard:leaderboard,
    live_events:this.events.slice(-40)
  };
};

/* =========================================================
   4. ARAYÜZ
   ========================================================= */
var CODE_TO_DISPLAY={};
ROSTER.forEach(function(r){ CODE_TO_DISPLAY[r.code]=r.displayCode||r.code; });
var sim=new YarisSimulasyonu();
var els={};
var running=true, speedMult=1;
var TICK_MS=1400;
var timer=null;

function cacheEls(){
  ['ui-status-badge','ui-status-text','ui-lap','ui-weather','ui-temp','ui-fastlap','btn-playpause','btn-speed','btn-restart',
   'ui-player-name','ui-player-mode','board-list','feed-list','ui-event-count','ui-push-sub'
  ].forEach(function(id){ els[id]=document.getElementById(id); });
}

function statusBadgeClass(status){
  if(status==='Güvenlik Aracı'||status==='Sanal Güvenlik Aracı') return 'is-flag';
  if(status==='Bitiş Bayrağı') return 'is-finish';
  return '';
}

function renderHeader(snap){
  els['ui-lap'].innerHTML=snap.race_state.current_lap+'<small style="font-size:11px;color:var(--text-mute)"> / '+snap.race_state.total_laps+'</small>';
  els['ui-weather'].textContent=snap.race_state.weather;
  els['ui-temp'].textContent=snap.race_state.track_temp;
  els['ui-fastlap'].textContent = sim.fastestLap ? fmtLap(sim.fastestLap.time)+' ('+sim.fastestLap.code+')' : '—';
  els['ui-status-text'].textContent=snap.race_state.track_status;
  els['ui-status-badge'].className='status-badge '+statusBadgeClass(snap.race_state.track_status);

  var player=sim.drivers.filter(function(d){return d.code==='PAD1';})[0];
  els['ui-player-name'].textContent=player.name;
  els['ui-player-mode'].textContent=player.mode.toUpperCase();
  document.querySelectorAll('.cmd-btn').forEach(function(b){ b.classList.remove('is-active-mode'); });
  var modeBtn = player.mode==='Agresif' ? document.querySelector('[data-cmd="agresif"]') : (player.mode==='Tasarruf'?document.querySelector('[data-cmd="koru"]'):null);
  if(modeBtn) modeBtn.classList.add('is-active-mode');

  var pushBtn=document.querySelector('[data-cmd="push"]');
  if(player.pushCooldown>0){ pushBtn.classList.add('is-locked'); els['ui-push-sub'].textContent='('+player.pushCooldown+' tur)'; }
  else { pushBtn.classList.remove('is-locked'); els['ui-push-sub'].textContent='(Push)'; }
  var pitBtn=document.querySelector('[data-cmd="pit"]');
  if(player.dnf||sim.finished) pitBtn.classList.add('is-locked'); else pitBtn.classList.remove('is-locked');
}

function renderBoard(snap){
  els['board-list'].innerHTML=snap.leaderboard.map(function(row){
    var color=TEAM_COLORS[row.team_code]||'#5c6c80';
    var isPlayer=row.team_code==='PAD1';
    var isDnf=row.gap==='DNF';
    var wear=row.tyre.wear_percent;
    return '<div class="row'+(isPlayer?' is-player':'')+(isDnf?' is-dnf':'')+'" style="--tc:'+color+'">'
      +'<span class="pos">'+(isDnf?'DNF':row.position)+'</span>'
      +'<span class="bar"></span>'
      +'<span class="drv"><b>'+row.driver_name+'</b><span>'+(CODE_TO_DISPLAY[row.team_code]||row.team_code)+' · Ar '+row.interval+' · Fark '+row.gap+'</span></span>'
      +'<span class="lap">'+row.last_lap+'</span>'
      +'<span class="tyre-cell"><span class="tyre-badge">'+row.tyre.compound+'</span><span class="wear-bar"><i style="width:'+wear+'%;background:'+wearColor(wear)+'"></i></span></span>'
      +'</div>';
  }).join('');
}

function renderFeed(snap){
  var events=snap.live_events;
  var toRender = events.filter(function(ev){ return ev.id>lastRenderedId; });
  toRender.forEach(function(ev){
    var row=document.createElement('div');
    row.className='feed-row ev-'+ev.type;
    row.innerHTML='<span class="lap-tag mono">T'+ev.lap+'</span><span class="msg">'+ev.message+'</span>';
    els['feed-list'].appendChild(row);
    lastRenderedId=ev.id;
  });
  while(els['feed-list'].children.length>150) els['feed-list'].removeChild(els['feed-list'].firstChild);
  els['ui-event-count'].textContent=sim.eventSeq+' olay';

  var list=els['feed-list'];
  var nearBottom = list.scrollHeight-list.scrollTop-list.clientHeight < 80;
  if(toRender.length && nearBottom) list.scrollTop=list.scrollHeight;
}
var lastRenderedId=0;

function renderAll(){
  var snap=sim.getSnapshot();
  renderHeader(snap);
  renderBoard(snap);
  renderFeed(snap);
}

function step(){
  sim.tick();
  renderAll();
  if(sim.finished){
    running=false;
    els['btn-playpause'].textContent='▶ Bitti';
    els['btn-playpause'].classList.remove('is-active');
    stopTimer();
  }
}

function startTimer(){
  stopTimer();
  timer=setInterval(step, TICK_MS/speedMult);
}
function stopTimer(){ if(timer){ clearInterval(timer); timer=null; } }

function bindUI(){
  document.querySelectorAll('.cmd-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      sim.playerCommand(btn.getAttribute('data-cmd'));
      renderAll();
    });
  });
  els['btn-playpause'].addEventListener('click', function(){
    if(sim.finished) return;
    running=!running;
    if(running){ els['btn-playpause'].textContent='⏸ Duraklat'; els['btn-playpause'].classList.add('is-active'); startTimer(); }
    else { els['btn-playpause'].textContent='▶ Devam Et'; els['btn-playpause'].classList.remove('is-active'); stopTimer(); }
  });
  els['btn-speed'].addEventListener('click', function(){
    var seq=[1,2,4]; speedMult=seq[(seq.indexOf(speedMult)+1)%seq.length];
    els['btn-speed'].textContent='Hız: '+speedMult+'×';
    if(running) startTimer();
  });
  els['btn-restart'].addEventListener('click', function(){
    stopTimer();
    sim=new YarisSimulasyonu();
    lastRenderedId=0;
    els['feed-list'].innerHTML='';
    running=true; speedMult=1;
    els['btn-playpause'].textContent='⏸ Duraklat'; els['btn-playpause'].classList.add('is-active');
    els['btn-speed'].textContent='Hız: 1×';
    renderAll();
    startTimer();
  });
}

function boot(){
  cacheEls();
  bindUI();
  renderAll();
  startTimer();
}
boot();

window.YarisSimulasyonu=YarisSimulasyonu;
window.getRaceSnapshot=function(){ return sim.getSnapshot(); };
})();
</script>
