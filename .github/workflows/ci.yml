name: CI

on:
  push:
    branches: [main, redesign]
  pull_request:

jobs:
  unit:
    name: Golden data tests (no network)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/test_data_logic.py -q

  smoke:
    name: Page smoke test (regression net)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Every router page loads without a code-level exception
        run: python tests/smoke_test.py
